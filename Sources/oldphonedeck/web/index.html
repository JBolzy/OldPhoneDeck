<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- OldPhoneDeck: a Stream Deck–style home for a phone in landscape.
     Must run in iOS 8/9 Safari (iPhone 4S): ES5 syntax only, no fetch, no flex gap, no Intl. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OldPhoneDeck">
<meta name="theme-color" content="#050507">
<title>OldPhoneDeck</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; color: #f5f5f7;
    background: radial-gradient(ellipse at 0% 0%, rgba(94,92,230,.20), rgba(0,0,0,0) 55%),
                radial-gradient(ellipse at 100% 100%, rgba(217,119,87,.14), rgba(0,0,0,0) 55%), #050507;
    font: 13px -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased;
    -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
  /* Everything is laid out on a stage 320pt tall; its width follows the screen (480 on a 4S, wider on modern phones). */
  #stage { position: absolute; left: 0; top: 0; width: 480px; height: 320px; overflow: hidden;
    -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  /* Measures the notch / Dynamic Island / home-indicator insets (0 on old iOS, which ignores env()). */
  #safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .view { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: none; }
  .view.on { display: block; }

  /* ---- status bar: one compact row (clock, attention strip, Mac name) ---- */
  #status { position: absolute; left: 0; right: 0; top: 0; height: 36px; z-index: 5; }
  #clock { position: absolute; left: 16px; top: 6px; line-height: 24px; white-space: nowrap; }
  #time { font: 700 22px "SF Pro Rounded", ui-rounded, -apple-system, "Helvetica Neue", sans-serif; letter-spacing: -.6px;
    -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum"; }
  #ampm { font-size: 10px; font-weight: 700; color: #8e8e93; margin-left: 3px; letter-spacing: .3px; }
  #date { margin-left: 10px; font-size: 9px; font-weight: 600; letter-spacing: .9px; text-transform: uppercase; color: #8e8e93; }
  #right { position: absolute; right: 16px; top: 10px; font-size: 11px; font-weight: 600; color: #c7c7cc; white-space: nowrap; }
  #link { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: #ff453a; margin-right: 5px; vertical-align: 1px; }
  #link.ok { background: #30d158; }
  .batt { display: inline-block; width: 20px; height: 9px; border: 1px solid rgba(255,255,255,.5); border-radius: 3px;
    position: relative; vertical-align: -1px; margin-left: 8px; }
  .batt:after { content: ""; position: absolute; right: -3px; top: 2px; width: 1.5px; height: 5px; background: rgba(255,255,255,.5); border-radius: 0 1px 1px 0; }
  .batt i { position: absolute; left: 1px; top: 1px; bottom: 1px; border-radius: 1px; background: #fff; }

  /* ---- keys: a 2x2 grid, sized and placed by layout() ---- */
  .key { position: absolute; text-align: center; }
  .cap { position: relative; border-radius: 24%;
    background: linear-gradient(180deg, #303036 0%, #1b1b1f 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.11), inset 0 -1px 0 rgba(0,0,0,.6), 0 3px 0 #0a0a0c, 0 8px 16px rgba(0,0,0,.55);
    -webkit-transition: -webkit-transform .08s, box-shadow .08s; transition: transform .08s, box-shadow .08s; }
  .cap img { position: absolute; left: 14%; top: 14%; width: 72%; height: 72%; }
  .key.down .cap { -webkit-transform: translateY(2px) scale(.97); transform: translateY(2px) scale(.97);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 0 #0a0a0c, 0 2px 6px rgba(0,0,0,.5); }
  .key .label { margin-top: 8px; font-size: 11px; font-weight: 500; color: #aeaeb2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .key.empty .cap { background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .key.empty .cap:after { content: "+"; position: absolute; left: 0; right: 0; top: 50%; line-height: 1; font-size: 36px; font-weight: 200; color: #636366;
    text-align: center; -webkit-transform: translateY(-52%); transform: translateY(-52%); }
  #hint { position: absolute; top: 290px; font-size: 9.5px; color: #48484a; text-align: center; }

  /* ---- widgets ---- */
  .card { position: absolute; border-radius: 18px; box-sizing: border-box; padding: 11px 12px; overflow: hidden;
    background: rgba(255,255,255,.065); box-shadow: inset 0 0 0 .5px rgba(255,255,255,.12); }
  .card h3 { margin: 0 0 7px; font-size: 9.5px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #8e8e93; }
  .big { font-size: 24px; font-weight: 600; letter-spacing: -.8px; line-height: 26px; white-space: nowrap; }
  .big small { font-size: 10px; font-weight: 600; color: #8e8e93; letter-spacing: 0; margin-left: 3px; }
  .sub { font-size: 10.5px; color: #c7c7cc; margin-top: 3px; white-space: nowrap; }
  .arrow { color: #64d2ff; font-weight: 700; }
  .arrow.up { color: #30d158; }
  #spark { display: block; margin-top: 6px; }
  .foot { position: absolute; left: 12px; right: 12px; bottom: 9px; font-size: 9px; color: #636366; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Batteries: compact chips, icon + percentage */
  .chip { float: left; width: 50%; height: 30px; position: relative; box-sizing: border-box; padding-right: 6px; }
  .chip svg { position: absolute; left: 0; top: 8px; width: 13px; height: 13px; }
  .chip b { position: absolute; left: 17px; top: 7px; font-size: 11.5px; font-weight: 600; color: #f5f5f7; letter-spacing: -.3px;
    -webkit-font-feature-settings: "tnum"; font-feature-settings: "tnum"; }
  .chip:nth-child(2n) { padding-left: 6px; }
  .chip:nth-child(2n) svg { left: 6px; }
  .chip:nth-child(2n) b { left: 23px; }
  .chip b.mid { color: #ffd60a; }
  .chip b.low { color: #ff453a; }
  .chip b.chg { color: #30d158; }
  .empty-note { font-size: 10px; color: #636366; }
  /* System: CPU / RAM / disk rows with a thin usage bar */
  .srow { position: relative; height: 19px; font-size: 10.5px; color: #c7c7cc; white-space: nowrap; }
  .srow b { position: absolute; right: 0; top: 0; font-weight: 600; color: #f5f5f7; letter-spacing: -.2px; }
  .sbar { position: absolute; left: 0; right: 0; top: 14px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  .sfill { display: block; height: 100%; width: 0; border-radius: 2px; background: #64d2ff; }
  .sfill.mid { background: #ffd60a; }
  .sfill.low { background: #ff453a; }
  .tap { cursor: pointer; }
  .srow.hero { height: 41px; font-size: 11.5px; color: #f5f5f7; }
  .srow.hero i { font-style: normal; color: #636366; }
  .srow.hero b { font-size: 13px; }
  .srow.hero .sbar { top: 19px; height: 5px; border-radius: 3px; }
  .srow.hero .sfill { border-radius: 3px; }
  .spress { position: absolute; left: 0; right: 0; top: 28px; height: 12px; font-size: 9px; color: #8e8e93; white-space: nowrap; }
  .spress .pr { position: absolute; right: 0; top: 0; display: none; }
  .spress u { text-decoration: none; font-weight: 600; color: #c7c7cc; }
  .spress u.mid { color: #ffd60a; }
  .spress u.low { color: #ff453a; }
  /* attention strip: hidden while everything is fine */
  #alert { position: absolute; height: 22px; line-height: 22px; border-radius: 11px; padding: 0 10px; box-sizing: border-box; display: none;
    font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: rgba(255,214,10,.16); color: #ffd60a; box-shadow: inset 0 0 0 .5px rgba(255,214,10,.4); }
  #alert.bad { background: rgba(255,69,58,.18); color: #ff6961; box-shadow: inset 0 0 0 .5px rgba(255,69,58,.5); }
  #stage.offline .card { opacity: .35; }
  #sUp { float: right; font-size: 9px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #636366; }
  #netLink { position: absolute; right: 12px; top: 11px; font-size: 9px; font-weight: 600; color: #8e8e93; white-space: nowrap; }
  #netLink.weak { color: #ffd60a; }
  #netLink.bad { color: #ff453a; }
  .tp.ol span { color: #64d2ff; }
  /* ---- memory overlay (tap RAM) ---- */
  #mem .sheet { top: 6px; padding: 11px 13px 10px; }
  #mem h2 { margin-bottom: 5px; }
  #memStat { font-size: 10.5px; color: #8e8e93; margin-bottom: 5px; }
  #memStat b { font-weight: 600; color: #f5f5f7; }
  #memStat b.mid { color: #ffd60a; }
  #memStat b.low { color: #ff453a; }
  .mrow { position: relative; height: 19px; font-size: 10.5px; color: #c7c7cc; white-space: nowrap; }
  .mrow span { display: block; width: 255px; overflow: hidden; text-overflow: ellipsis; }
  .mrow b { position: absolute; right: 0; top: 0; font-weight: 600; color: #f5f5f7; }
  .mrow .sbar { top: 14px; }
  .mrow.ol { height: 26px; margin-bottom: 4px; padding-bottom: 3px; border-bottom: .5px solid rgba(255,255,255,.12); }
  .mrow.ol span { line-height: 22px; width: 190px; }
  .mrow.ol b { right: 66px; line-height: 22px; }
  .ubtn { position: absolute; right: 0; top: 0; height: 22px; line-height: 22px; padding: 0 11px; border-radius: 11px;
    background: #3a3a3c; color: #fff; font-size: 11px; font-weight: 600; }
  #top h3 i { font-style: normal; color: #636366; }
  /* ---- top memory: three apps, name left, size right ---- */
  .tp { position: relative; height: 26px; }
  .tp span { position: absolute; left: 0; right: 54px; top: 6px; font-size: 10.5px; color: #c7c7cc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tp b { position: absolute; right: 0; top: 4px; font-size: 12px; font-weight: 600; letter-spacing: -.4px; color: #f5f5f7; }
  .tp b.mid { color: #ffd60a; }
  .tp b.low { color: #ff453a; }

  /* ---- sheets ---- */
  .scrim { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,.55); z-index: 10; display: none; }
  .scrim.on { display: block; }
  .sheet { position: absolute; top: 8px; left: 50%; width: 360px; margin-left: -180px; border-radius: 20px; padding: 13px; box-sizing: border-box;
    background: #1c1c1e; box-shadow: inset 0 0 0 .5px rgba(255,255,255,.1), 0 20px 40px rgba(0,0,0,.6); }
  .sheet h2 { margin: 0 0 9px; font-size: 13px; font-weight: 600; }
  .sheet h2 small { font-size: 10.5px; font-weight: 500; color: #8e8e93; }
  .btns { margin-top: 9px; overflow: hidden; }
  .btn { float: right; margin-left: 8px; padding: 0 15px; height: 28px; line-height: 28px; border-radius: 14px; font-size: 12px; font-weight: 600;
    background: #3a3a3c; color: #fff; }
  .btn.primary { background: #d97757; }
  #edit .sheet { left: 8px; right: 8px; width: auto; margin-left: 0; top: 8px; bottom: 8px; padding: 10px 10px 0; }
  #filter { position: absolute; left: 10px; right: 150px; top: 10px; height: 28px; box-sizing: border-box; border: 0; border-radius: 9px;
    background: #2c2c2e; color: #fff; padding: 0 10px; font-size: 13px; outline: none; -webkit-user-select: text; }
  #edit .btns { position: absolute; right: 10px; top: 10px; margin: 0; }
  #editCount { position: absolute; left: 12px; top: 44px; font-size: 10px; color: #8e8e93; }
  #editList { position: absolute; left: 6px; right: 6px; top: 60px; bottom: 0; overflow-y: scroll; -webkit-overflow-scrolling: touch; }
  .erow { height: 34px; position: relative; border-bottom: .5px solid rgba(255,255,255,.08); }
  .erow img { position: absolute; left: 30px; top: 4px; width: 26px; height: 26px; }
  .erow .nm { position: absolute; left: 64px; right: 40px; top: 9px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .erow .ck { position: absolute; left: 4px; top: 8px; width: 18px; height: 18px; border-radius: 9px; box-shadow: inset 0 0 0 1.5px #48484a;
    text-align: center; line-height: 18px; font-size: 11px; font-weight: 700; color: #fff; }
  .erow.on .ck { background: #0a84ff; box-shadow: none; }
  .erow .up { position: absolute; right: 4px; top: 4px; width: 30px; height: 26px; line-height: 26px; text-align: center; color: #8e8e93; }
  .erow.full { opacity: .35; }

  #toast { position: absolute; left: 50%; top: 38px; -webkit-transform: translateX(-50%); transform: translateX(-50%); z-index: 20;
    background: rgba(44,44,46,.95); padding: 6px 12px; border-radius: 12px; font-size: 11px; font-weight: 500; white-space: nowrap; display: none; }
  #login .sheet { top: 40px; text-align: center; }
  #code { width: 70%; height: 32px; border: 0; border-radius: 9px; background: #2c2c2e; color: #fff; text-align: center; font-size: 16px; }
</style>
</head>
<body>
<div id="safe"></div>
<div id="stage">
  <div id="toast"></div>

  <!-- The deck: 2x2 app keys (left) + 2x2 status cards (right) -->
  <div id="deck" class="view on">
    <div id="alert"></div>
    <div id="keys"></div>
    <div id="hint">Hold any key to choose apps</div>
    <div id="top" class="card tap"><h3>Top memory <i>›</i></h3><div id="topList"></div></div>
    <div id="net" class="card">
      <h3 id="netTitle">Internet</h3><div id="netLink"></div>
      <div class="big"><span class="arrow">↓</span> <span id="down">–</span><small>Mbps</small></div>
      <div class="sub"><span class="arrow up">↑</span> <span id="up">–</span> Mbps · <span id="ping">–</span> ms</div>
      <canvas id="spark" width="208" height="36"></canvas>
    </div>
    <div id="bat" class="card"><h3>Batteries</h3><div id="batList"></div></div>
    <div id="sys" class="card"><h3>System <span id="sUp"></span></h3>
      <div class="srow hero tap" id="ramHero"><span>RAM <i>›</i></span><b id="sRam">–</b><span class="sbar"><span class="sfill" id="sRamBar"></span></span>
        <div class="spress"><span><span id="sPressLbl">Pressure </span><u id="sPress">–</u></span><span class="pr" id="sSwapBox"><u id="sSwap">–</u> swap</span></div></div>
      <div class="srow"><span>CPU</span><b id="sCpu">–</b><span class="sbar"><span class="sfill" id="sCpuBar"></span></span></div>
      <div class="srow"><span>Disk</span><b id="sDisk">–</b><span class="sbar"><span class="sfill" id="sDiskBar"></span></span></div>
    </div>
  </div>

  <div id="status">
    <div id="clock"><span id="time">–</span><span id="ampm"></span><span id="date"></span></div>
    <div id="right"><span id="link"></span><span id="macName">Mac</span><span id="phoneBatt" style="display:none"><span class="batt"><i id="phoneBattFill"></i></span></span></div>
  </div>

  <!-- Choose the 4 apps -->
  <div id="edit" class="scrim">
    <div class="sheet">
      <input id="filter" placeholder="Search apps" autocorrect="off" autocapitalize="none">
      <div class="btns"><div class="btn primary" id="editSave">Save</div><div class="btn" id="editCancel">Cancel</div></div>
      <div id="editCount"></div>
      <div id="editList"></div>
    </div>
  </div>

  <!-- RAM detail: top apps by memory, pressure, swap, Ollama -->
  <div id="mem" class="scrim">
    <div class="sheet">
      <h2>Memory <small>· tap outside to close</small></h2>
      <div id="memStat"></div>
      <div id="memOl"></div>
      <div id="memList"></div>
    </div>
  </div>

  <div id="login" class="scrim">
    <div class="sheet">
      <h2>Enter the access code from the Mac</h2>
      <input id="code" autocapitalize="none" autocorrect="off">
      <div class="btns"><div class="btn primary" id="go">Connect</div></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var APP_SLOTS = 4;   // a 2x2 grid of apps
  var modern = 'isSecureContext' in window;   // iOS 11.1+; the 4S is never "modern"

  // ---------- plumbing ----------
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var m = /k=([a-z0-9]+)/.exec(location.hash);
  var token = m ? m[1] : store('token');
  if (m) store('token', token);
  function url(path, extra) { return path + '?k=' + token + (extra ? '&' + extra : ''); }
  function xhr(method, path, body, cb) {
    var r = new XMLHttpRequest();
    r.open(method, path, true);
    if (body !== null && body !== undefined) r.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    r.onload = function () { if (cb) cb(r.status, r.responseText); };
    r.onerror = function () { if (cb) cb(0, ''); };
    r.send(body === undefined ? null : body);
  }
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, 1700);
  }
  // Tap handler: instant on touch (no 300 ms delay), works with a mouse too, shows a pressed state.
  function tap(el, fn, hold) {
    var moved, held, timer;
    el.addEventListener('touchstart', function (e) {
      moved = false; held = false; el.className += ' down';
      if (hold) timer = setTimeout(function () { held = true; unpress(); hold(e); }, 550);
    });
    el.addEventListener('touchmove', function () { moved = true; clearTimeout(timer); unpress(); });
    el.addEventListener('touchend', function (e) {
      e.preventDefault(); clearTimeout(timer); unpress();
      if (!moved && !held) fn(e);
    });
    el.addEventListener('click', function (e) { fn(e); });
    function unpress() { el.className = el.className.replace(/ down/g, ''); }
  }
  function px(el, props) { for (var k in props) el.style[k] = props[k] + 'px'; }

  // ---------- layout ----------
  // Landscape: the stage is 320pt tall and as wide as the screen's shape (480 on a 4S, ~700 on an iPhone 17).
  // Portrait (modern phones held upright): 360pt wide, keys on top, widgets below.
  // The stage sits inside the safe area; the page background fills the rest of the screen.
  var W = 480, H = 320, portrait = false;
  function insets() {
    var cs = window.getComputedStyle($('safe'));
    return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0,
             b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
  }
  function fit() {
    var iw = window.innerWidth, ih = window.innerHeight, ins = insets();
    var aw = iw - ins.l - ins.r, ah = ih - ins.t - ins.b;
    portrait = modern && ah > aw * 1.2;
    if (portrait) { W = 360; H = Math.max(520, Math.round(360 * ah / aw)); }
    else { H = 320; W = Math.max(480, Math.min(760, Math.round(320 * aw / ah))); }
    var s = Math.min(aw / W, ah / H), st = $('stage');
    st.style.width = W + 'px'; st.style.height = H + 'px';
    st.style.webkitTransform = st.style.transform = 'scale(' + s + ')';
    st.style.left = ins.l + (aw - W * s) / 2 + 'px';
    st.style.top = ins.t + (ah - H * s) / 2 + 'px';
    layout();
  }
  var keyGeom = { cap: 90, x0: 16, y0: 52, rowH: 110 };
  function placeKeys() {
    var ks = $('keys').children, g = keyGeom;
    for (var i = 0; i < ks.length; i++) {
      var col = i % 2, row = (i - col) / 2;
      px(ks[i], { left: g.x0 + col * (g.cap + 10), top: g.y0 + row * (g.rowH + 10), width: g.cap });
      px(ks[i].firstChild, { width: g.cap, height: g.cap });
    }
  }
  function layout() {
    // Two 2x2 grids: app keys on the left, status cards (Internet, System / Batteries, Top memory) on the right.
    // Portrait (modern phones upright): keys on top, the cards in a 2x2 grid below.
    var net = $('net'), bat = $('bat'), sys = $('sys'), topCard = $('top');
    var cardW, cardH, cap, cardLeft, cardTop, cardGap = 10;
    $('hint').style.display = 'none';
    if (portrait) {
      var gTopP = 72;                                             // portrait: the attention strip sits at y=42
      var avail = H - gTopP - 12 - 74;                            // below the header, minus labels and gaps
      cardH = Math.max(96, Math.min(123, Math.floor(avail * 0.4)));
      cap = Math.max(60, Math.min(130, Math.floor((avail - 2 * cardH) / 2)));
      keyGeom = { cap: cap, x0: Math.round((W - (2 * cap + 10)) / 2), y0: gTopP, rowH: cap + 20 };
      cardW = Math.floor((W - 32 - cardGap) / 2);
      cardLeft = 16; cardTop = gTopP + 2 * (cap + 20) + 10 + 14;
      var pal = $('alert'); pal.style.left = '16px'; pal.style.right = 'auto'; pal.style.top = '42px'; pal.style.maxWidth = (W - 32) + 'px';
    } else {
      var gw = W - 32, gTop = 42;
      cardH = Math.floor((H - 12 - gTop - cardGap) / 2);
      cap = Math.min(cardH - 20, Math.floor((gw * 0.40 - 10) / 2));
      keyGeom = { cap: cap, x0: 16, y0: gTop, rowH: cardH };
      cardLeft = 16 + 2 * cap + 10 + 14;
      cardW = Math.floor((W - 16 - cardLeft - cardGap) / 2);
      cardTop = gTop;
      var al = $('alert'); al.style.left = 'auto'; al.style.top = '7px';   // between the clock and the Mac name
    }
    [net, sys, bat, topCard].forEach(function (c, i) {
      var col = i % 2, row = (i - col) / 2;
      px(c, { left: cardLeft + col * (cardW + cardGap), top: cardTop + row * (cardH + cardGap), width: cardW, height: cardH });
    });
    placeKeys();
    $('netLink').style.display = cardW >= 140 ? '' : 'none';   // no room next to the title on a narrow card
    batteryRows = Math.max(2, Math.floor((cardH - 41) / 30)) * 2;   // max chips that fit, two per row
    var spark = $('spark'), sw = cardW - 24, sh = Math.max(18, Math.min(40, cardH - 92));
    spark.width = sw * 2; spark.height = sh * 2;
    px(spark, { width: sw, height: sh });
    drawSpark(lastHistory); renderBatteries(lastBatteries);
    renderAlerts();
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });

  function sheet(id, on) { $(id).className = 'scrim' + (on ? ' on' : ''); }
  window.deckHome = function () { memOpen(false); sheet('edit', false); };

  // ---------- clock ----------
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  // Show the Mac's time, not the phone's: skew/tz come from /stats (null until the first poll).
  var clockSkew = null, clockTz = 0;
  function tick() {
    var d = new Date();
    var ampm = /[AaPp]\.?[Mm]/.test(d.toLocaleTimeString());
    if (clockSkew !== null) d = new Date(d.getTime() + clockSkew + clockTz * 1000);
    var h = clockSkew !== null ? d.getUTCHours() : d.getHours();
    var mi = clockSkew !== null ? d.getUTCMinutes() : d.getMinutes();
    var wd = clockSkew !== null ? d.getUTCDay() : d.getDay();
    var dd = clockSkew !== null ? d.getUTCDate() : d.getDate();
    var mo = clockSkew !== null ? d.getUTCMonth() : d.getMonth();
    $('time').textContent = (ampm ? (h % 12 || 12) : h) + ':' + ('0' + mi).slice(-2);
    $('ampm').textContent = ampm ? (h < 12 ? 'AM' : 'PM') : '';
    $('date').textContent = DAYS[wd] + ' · ' + dd + ' ' + MONTHS[mo];
  }
  setInterval(tick, 10000);

  // ---------- keys ----------
  var launcher = { selected: null, all: [] };
  function byPath(p) {
    for (var i = 0; i < launcher.all.length; i++) if (launcher.all[i].path === p) return launcher.all[i];
    return null;
  }
  function loadKeys() {
    xhr('GET', url('/launcher'), null, function (s, text) {
      if (s !== 200) return;
      launcher = JSON.parse(text);
      renderKeys();
    });
  }
  function key(cls, label, inner, onTap, onHold) {
    var k = document.createElement('div');
    k.className = 'key ' + cls;
    k.innerHTML = '<div class="cap">' + inner + '</div><div class="label"></div>';
    k.lastChild.textContent = label;
    tap(k, onTap, onHold);
    return k;
  }
  function renderKeys() {
    var box = $('keys'), apps = [];
    (launcher.selected || []).forEach(function (p) { var a = byPath(p); if (a && apps.length < APP_SLOTS) apps.push(a); });
    box.innerHTML = '';
    for (var i = 0; i < APP_SLOTS; i++) {
      (function (a) {
        if (!a) { box.appendChild(key('empty', 'Add', '', openEditor, openEditor)); return; }
        box.appendChild(key('', a.name, '<img src="' + url('/icon', 'path=' + encodeURIComponent(a.path)) + '">', function () {
          xhr('POST', url('/launch'), 'path=' + encodeURIComponent(a.path), function (s) { toast(s === 200 ? 'Opening ' + a.name : 'Launch failed'); });
        }, openEditor));
      })(apps[i]);
    }
    placeKeys();
  }

  // ---------- editor (hold any key) ----------
  var draft = [];
  function openEditor() {
    draft = (launcher.selected || []).slice(0, APP_SLOTS);
    $('filter').value = '';
    sheet('edit', true);
    renderEditor();
  }
  function renderEditor() {
    var box = $('editList'), q = $('filter').value.toLowerCase();
    box.innerHTML = '';
    $('editCount').textContent = draft.length + ' of ' + APP_SLOTS + ' apps · ▲ moves an app earlier';
    var chosen = draft.map(byPath).filter(function (a) { return a; });
    var rest = launcher.all.filter(function (a) { return draft.indexOf(a.path) < 0; });
    chosen.concat(rest).forEach(function (a) {
      if (q && a.name.toLowerCase().indexOf(q) < 0) return;
      var idx = draft.indexOf(a.path), on = idx >= 0, full = !on && draft.length >= APP_SLOTS;
      var row = document.createElement('div');
      row.className = 'erow' + (on ? ' on' : '') + (full ? ' full' : '');
      row.innerHTML = '<div class="ck">' + (on ? idx + 1 : '') + '</div><img><div class="nm"></div>' + (idx > 0 ? '<div class="up">▲</div>' : '');
      row.children[1].src = url('/icon', 'path=' + encodeURIComponent(a.path));
      row.children[2].textContent = a.name;
      if (idx > 0) row.lastChild.addEventListener('click', function (e) {
        e.stopPropagation(); draft.splice(idx, 1); draft.splice(idx - 1, 0, a.path); renderEditor();
      });
      row.addEventListener('click', function () {
        if (on) draft.splice(idx, 1);
        else if (full) return toast('All ' + APP_SLOTS + ' keys are used: remove one first');
        else draft.push(a.path);
        renderEditor();
      });
      box.appendChild(row);
    });
  }
  $('filter').addEventListener('input', renderEditor);
  tap($('editCancel'), function () { sheet('edit', false); });
  tap($('editSave'), function () {
    xhr('POST', url('/launcher'), 'paths=' + encodeURIComponent(draft.join('\n')), function (s) {
      if (s !== 200) return toast('Save failed');
      launcher.selected = draft.slice();
      renderKeys(); sheet('edit', false); toast('Apps saved');
    });
  });

  // ---------- widgets ----------
  function fmt(n) { return n >= 100 ? Math.round(n) : n >= 10 ? n.toFixed(0) : n.toFixed(1); }
  function ago(ms) {
    var s = Math.round((Date.now() - ms) / 1000);
    return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago';
  }
  var lastHistory = [];
  function drawSpark(hist) {
    lastHistory = hist || [];
    var c = $('spark'), g = c.getContext('2d'), w = c.width, h = c.height;
    g.clearRect(0, 0, w, h);
    if (lastHistory.length < 2) return;
    var max = 1; lastHistory.forEach(function (v) { if (v > max) max = v; });
    g.beginPath();
    lastHistory.forEach(function (v, i) {
      var x = i * w / (lastHistory.length - 1), y = h - 3 - (v / max) * (h - 6);
      if (i) g.lineTo(x, y); else g.moveTo(x, y);
    });
    g.strokeStyle = '#64d2ff'; g.lineWidth = 2.5; g.lineJoin = 'round'; g.stroke();
    g.lineTo(w, h); g.lineTo(0, h); g.closePath();
    var grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, 'rgba(100,210,255,.35)'); grad.addColorStop(1, 'rgba(100,210,255,0)');
    g.fillStyle = grad; g.fill();
  }
  // Small line icons per device kind, drawn like SF Symbols.
  var ICONS = {
    phone: '<rect x="4" y="1" width="6" height="12" rx="1.6"/><path d="M6.3 11h1.4"/>',
    laptop: '<rect x="2.5" y="3" width="9" height="6" rx="1"/><path d="M1 11.5h12"/>',
    keyboard: '<rect x="1" y="3.5" width="12" height="7" rx="1.5"/><path d="M3.5 6h.01M5.8 6h.01M8.2 6h.01M10.5 6h.01M4.5 8.3h5"/>',
    mouse: '<rect x="4" y="1.5" width="6" height="11" rx="3"/><path d="M7 3.5v2"/>',
    trackpad: '<rect x="2" y="2.5" width="10" height="9" rx="1.8"/>',
    'case': '<rect x="2" y="4" width="10" height="7.5" rx="2.5"/><path d="M2 6.5h10"/>',
    headphones: '<path d="M2.2 9V7.2a4.8 4.8 0 0 1 9.6 0V9"/><rect x="1.5" y="8.5" width="2.6" height="4" rx="1"/><rect x="9.9" y="8.5" width="2.6" height="4" rx="1"/>'
  };
  function icon(kind) {
    return '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#aeaeb2" stroke-width="1.2" stroke-linecap="round">' +
      (ICONS[kind] || ICONS.keyboard) + '</svg>';
  }
  var phone = null, batteryRows = 4;   // phone: the device's own battery, when the browser exposes it
  window.deckPhone = function (s) { phone = s; renderPhone(); renderBatteries(lastBatteries); };
  function renderPhone() {
    if (!phone) return;
    $('phoneBatt').style.display = '';
    var f = $('phoneBattFill'), pct = Math.round(phone.level * 100);
    f.style.width = Math.max(1, pct * 16 / 100) + 'px';
    f.style.background = phone.charging ? '#30d158' : pct <= 20 ? '#ff453a' : '#fff';
  }
  // Modern Safari can read its own battery via the Battery API where available; harmless elsewhere.
  if (navigator.getBattery) navigator.getBattery().then(function (b) {
    function upd() { window.deckPhone({ level: b.level, charging: b.charging }); }
    upd(); b.addEventListener('levelchange', upd); b.addEventListener('chargingchange', upd);
  });
  var lastBatteries = [];
  function renderBatteries(list) {
    lastBatteries = list || [];
    var rows = lastBatteries.slice();
    if (phone) rows.unshift({ name: 'iPhone', kind: 'phone', level: Math.round(phone.level * 100), charging: phone.charging });
    var box = $('batList');
    box.innerHTML = '';
    if (!rows.length) { box.innerHTML = '<div class="empty-note">No wireless accessories connected</div>'; return; }
    var chips = [];
    rows.forEach(function (b) {
      chips.push({ kind: b.kind, level: b.level, charging: b.charging, name: b.name });
      if (b['case'] !== undefined) chips.push({ kind: 'case', level: b['case'], name: b.name + ' case' });
    });
    chips = chips.slice(0, batteryRows);
    chips.forEach(function (b) {
      var c = document.createElement('div');
      c.className = 'chip';
      c.title = b.name;
      c.innerHTML = icon(b.kind) + '<b></b>';
      var t = c.lastChild;
      t.textContent = b.level + '%';
      t.className = b.charging ? 'chg' : b.level <= 20 ? 'low' : b.level <= 40 ? 'mid' : '';
      box.appendChild(c);
    });
  }
  function renderSys(s) {
    s = s || {};
    function row(id, pct, text, tip, level) {
      $(id).textContent = text;
      $(id).parentNode.title = tip || '';
      var bar = $(id + 'Bar');
      bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
      bar.className = 'sfill' + (level ? ' ' + level : pct >= 90 ? ' low' : pct >= 75 ? ' mid' : '');
    }
    var GB = 1073741824;
    function gb(n) { return (n / GB).toFixed(n < 10 * GB ? 1 : 0); }
    if (s.uptime) {
      var up = Math.floor(s.uptime / 60), dd = Math.floor(up / 1440), hh = Math.floor(up % 1440 / 60);
      $('sUp').textContent = 'up ' + (dd ? dd + 'd ' + hh + 'h' : hh ? hh + 'h ' + up % 60 + 'm' : up + 'm');
    }
    if (s.cpu !== undefined) row('sCpu', s.cpu, Math.round(s.cpu) + '%');
    if (s.ramTotal) {
      // macOS keeps RAM nearly full on purpose; memory pressure is what says whether that is a problem.
      var lv = s.pressure === 'critical' ? 'low' : s.pressure === 'warn' ? 'mid' : '';
      row('sRam', s.ramUsed / s.ramTotal * 100, gb(s.ramUsed) + ' / ' + gb(s.ramTotal) + ' GB', '', lv || 'ok');
      $('sPress').textContent = s.pressure === 'critical' ? 'Critical' : s.pressure === 'warn' ? 'Warning' : 'Normal';
      $('sPress').className = lv;
      $('sSwap').textContent = mbText(s.swapMB || 0);
      $('sSwap').className = (s.swapMB || 0) >= 2048 ? 'mid' : '';
      var showSwap = s.swapMB >= 1024;   // swap is only worth a mention once it is real
      $('sSwapBox').style.display = showSwap ? 'block' : 'none';
      $('sPressLbl').style.display = showSwap ? 'none' : '';   // no room for both labels
    }
    if (s.diskTotal) {
      var used = s.diskTotal - s.diskFree, freePct = s.diskFree / s.diskTotal * 100;
      row('sDisk', used / s.diskTotal * 100, gb(s.diskFree) + ' GB free', gb(used) + ' GB used of ' + gb(s.diskTotal) + ' GB',
        freePct < 5 ? 'low' : freePct < 15 ? 'mid' : 'ok');
    }
  }
  function renderLink(l) {
    var el = $('netLink');
    if (!l || !l.type) { el.textContent = ''; return; }
    var r = l.rate ? (l.rate >= 1000 ? (l.rate / 1000).toFixed(l.rate % 1000 ? 1 : 0) + ' Gb' : Math.round(l.rate) + ' Mb') : '';
    el.textContent = (l.type === 'wifi' ? 'Wi-Fi' : 'Ethernet') + (r ? ' ' + r : '');
    el.className = l.type === 'wifi' && l.rssi && l.rssi <= -80 ? 'bad' : l.type === 'wifi' && l.rssi && l.rssi <= -70 ? 'weak' : '';
    el.title = l.type === 'wifi' && l.rssi ? 'Signal ' + l.rssi + ' dBm' : '';
  }
  // ---------- attention strip + offline state ----------
  var lastStats = null, pollFails = 0, offline = false, lastSeen = '';
  function renderAlerts() {
    var items = [], d = lastStats || {}, s = d.sys || {};
    function add(text, sev) { items.push({ t: text, sev: sev, i: items.length }); }
    if (offline) add('Offline' + (lastSeen ? ' · last seen ' + lastSeen : ''), 2);
    else {
      if (s.pressure === 'critical') add('Memory critical', 2);
      else if (s.pressure === 'warn') add('Memory pressure', 1);
      if ((s.swapMB || 0) >= 2048) add('Swap ' + mbText(s.swapMB), 1);
      if (s.diskTotal) {
        var fp = s.diskFree / s.diskTotal * 100;
        if (fp < 5) add('Disk ' + Math.round(fp) + '% free', 2);
        else if (fp < 15) add('Disk ' + Math.round(fp) + '% free', 1);
      }
      var n = d.updates && d.updates.count, h = d.health || {}, l = d.link || {};
      if (h.throttle) add('CPU throttled to ' + h.throttle + '%', 1);
      (h.agents || []).forEach(function (a) { add('Agent failed: ' + a.replace(/^com\./, ''), 2); });
      if (l.type === 'wifi' && l.rssi && l.rssi <= -75) add('Weak Wi-Fi', 1);
      if (n) add(n + ' macOS update' + (n > 1 ? 's' : ''), 1);
    }
    items.sort(function (a, b) { return b.sev - a.sev || a.i - b.i; });
    var all = items.map(function (x) { return x.t; });
    var el = $('alert');
    el.textContent = all.join(' · ');   // most serious first; CSS ellipsis cuts it, the tooltip has it all
    el.title = all.join('\n');
    el.className = items.length && items[0].sev === 2 ? 'bad' : '';
    el.style.display = items.length ? 'block' : 'none';
    $('macName').style.display = items.length && !portrait ? 'none' : '';   // the strip takes the Mac name's place
    if (!portrait) {
      var edge = 16 + $('right').offsetWidth + 8;   // keep clear of the connection dot
      el.style.right = edge + 'px';
      el.style.maxWidth = Math.max(0, W - edge - (16 + $('clock').offsetWidth + 12)) + 'px';
    }
    $('stage').className = offline ? 'offline' : '';
  }
  // ---------- memory overlay ----------
  var memTimer = null, memOlKey = '';
  function memOpen(on) {
    sheet('mem', on);
    clearInterval(memTimer);
    memTimer = null;
    if (on) { memOlKey = ''; memPoll(); memTimer = setInterval(memPoll, 3000); }
  }
  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function mbText(mb) { return mb >= 1024 ? (mb / 1024).toFixed(1) + ' GB' : mb + ' MB'; }
  function memPoll() {
    xhr('GET', url('/memory'), null, function (st, text) {
      if (st !== 200 || !memTimer) return;
      var d = JSON.parse(text), i;
      var lv = d.pressure === 'critical' ? 'low' : d.pressure === 'warn' ? 'mid' : '';
      var word = d.pressure === 'critical' ? 'Critical' : d.pressure === 'warn' ? 'Warning' : 'Normal';
      $('memStat').innerHTML = 'Pressure <b class="' + lv + '">' + word + '</b> · Swap <b>' + mbText(d.swapMB || 0) + '</b>';
      renderTop(d.apps, d.ollama);
      var apps = (d.apps || []).slice(0, 10), top = apps.length ? apps[0].mb : 1, html = '';
      for (i = 0; i < apps.length; i++) {
        html += '<div class="mrow"><span>' + esc(apps[i].name) + '</span><b>' + mbText(apps[i].mb) + '</b>' +
          '<span class="sbar"><span class="sfill" style="width:' + Math.max(1, Math.round(apps[i].mb / top * 100)) + '%"></span></span></div>';
      }
      $('memList').innerHTML = html;
      var models = d.ollama || [], key = '';
      for (i = 0; i < models.length; i++) key += models[i].name + ':' + models[i].mb + ';';
      if (key === memOlKey) return;   // leave the Unload button alone unless something changed
      memOlKey = key;
      var box = $('memOl');
      box.innerHTML = '';
      models.forEach(function (m) {
        var row = document.createElement('div'); row.className = 'mrow ol';
        row.innerHTML = '<span>Ollama · ' + esc(m.name) + '</span><b>' + mbText(m.mb) + '</b>';
        var btn = document.createElement('div'); btn.className = 'ubtn'; btn.textContent = 'Unload';
        tap(btn, function () {
          btn.textContent = 'Unloading…';
          xhr('POST', url('/ollama/stop'), 'model=' + encodeURIComponent(m.name), function (s2) {
            toast(s2 === 200 ? 'Unloaded ' + m.name : 'Could not unload ' + m.name);
            setTimeout(memPoll, 500);
          });
        });
        row.appendChild(btn);
        box.appendChild(row);
      });
    });
  }
  tap($('ramHero'), function () { memOpen(true); });
  (function () {
    var scr = $('mem');
    function outside(e) { if (e.target === scr) memOpen(false); }
    scr.addEventListener('touchend', outside);
    scr.addEventListener('click', outside);
  })();

  function pollStats() {
    xhr('GET', url('/stats'), null, function (s, text) {
      $('link').className = s === 200 ? 'ok' : '';
      if (s !== 200) {
        if (++pollFails >= 2 && !offline) { offline = true; renderAlerts(); }
        return;
      }
      pollFails = 0; offline = false;
      var d = JSON.parse(text);
      lastStats = d;
      lastSeen = $('time').textContent + ($('ampm').textContent ? ' ' + $('ampm').textContent : '');
      if (d.now) { clockSkew = d.now * 1000 - new Date().getTime(); clockTz = d.tz || 0; tick(); }
      $('macName').textContent = d.mac.replace(/^\S+['’]s?\s+/, '');
      var sp = d.speed || {};
      $('down').textContent = sp.down !== undefined ? fmt(sp.down) : '–';
      $('up').textContent = sp.up !== undefined ? fmt(sp.up) : '–';
      $('ping').textContent = sp.ping !== undefined ? Math.round(sp.ping) : '–';
      $('net').title = sp.at ? 'Tested ' + ago(sp.at) : '';
      $('netTitle').textContent = sp.running ? 'Testing…' : 'Internet';
      drawSpark(d.net.history);
      renderBatteries(d.batteries);
      renderSys(d.sys);
      renderLink(d.link);
      renderAlerts();
    });
  }
  setInterval(pollStats, 2000);
  tap($('net'), function () {
    xhr('POST', url('/speedtest'), '', function () { $('netTitle').textContent = 'Testing…'; toast('Running a speed test (~20 s)'); });
  });

  // ---------- top memory ----------
  // Top memory card: the three biggest apps (helpers rolled up), from the same /memory data as the overlay.
  // A loaded Ollama model takes the third line: it is usually the biggest thing you chose to put in memory.
  function renderTop(apps, ollama) {
    var box = $('topList'), rows = (apps || []).slice(0, ollama && ollama.length ? 2 : 3);
    box.innerHTML = '';
    if (ollama && ollama.length) rows.push({ name: ollama[0].name, mb: ollama[0].mb, ol: true });   // cyan, titled "Ollama"
    rows.forEach(function (p) {
      var c = document.createElement('div');
      c.className = 'tp' + (p.ol ? ' ol' : '');
      c.innerHTML = '<span></span><b></b>';
      c.firstChild.textContent = p.name;
      c.title = (p.ol ? 'Ollama · ' : '') + p.name;
      var v = c.lastChild;
      v.textContent = mbText(p.mb);
      v.className = p.mb >= 16384 ? 'low' : p.mb >= 8192 ? 'mid' : '';
      box.appendChild(c);
    });
  }
  function topPoll() {
    if (offline) return;
    xhr('GET', url('/memory'), null, function (st, text) { if (st === 200) { var m = JSON.parse(text); renderTop(m.apps, m.ollama); } });
  }
  setInterval(topPoll, 10000);
  setTimeout(topPoll, 800);
  tap($('top'), function () { memOpen(true); });

  // ---------- boot ----------
  function connect() {
    xhr('GET', url('/info'), null, function (s) {
      if (s === 403 || !token) { sheet('login', true); return; }
      if (s !== 200) { $('link').className = ''; setTimeout(connect, 2000); return; }
      sheet('login', false);
      loadKeys();
      pollStats();
      if (/edit/.test(location.search)) setTimeout(openEditor, 300);
    });
  }
  tap($('go'), function () {
    token = $('code').value.replace(/\s/g, '').toLowerCase();
    store('token', token); location.hash = 'k=' + token; connect();
  });
  fit(); tick(); connect();
})();
</script>
</body>
</html>
